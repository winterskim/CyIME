name: CyIME Latest Full Offline ARM64 (Clipboard Guard v6)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream release tag (blank = latest)"
        required: false
        type: string
        default: ""
      edition:
        description: "Official 5+T9 or custom 9+T9 full offline models"
        required: true
        type: choice
        options:
          - official-full
          - expanded-10
        default: expanded-10
      minimum_version_code:
        description: "Optional versionCode override when above the calculated value"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cyime-fresh-offline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: 1. Resolve source release
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          REF="$SOURCE_REF"
          if [ -z "$REF" ]; then
            REF="$(gh api repos/Cyletix/CyIME/releases/latest --jq .tag_name)"
          fi
          [ -n "$REF" ] || { echo "Cannot resolve release tag"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using source tag: $REF"

      - name: 2. Checkout original CyIME source
        uses: actions/checkout@v4
        with:
          repository: Cyletix/CyIME
          ref: ${{ steps.source.outputs.ref }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: 3. Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 4. Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: 5. Install Android dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          chmod +x gradlew

      - name: 6. Apply upstream offline variant and ARM64-only ABI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle.kts')
          offline = Path('app/src/offline/AndroidManifest.xml')
          if not offline.exists():
              raise SystemExit('FAIL: official offline variant missing; review new upstream')
          xml = offline.read_text(encoding='utf-8')
          if not ('android.permission.INTERNET' in xml and 'tools:node="remove"' in xml):
              raise SystemExit('FAIL: official offline manifest no longer removes INTERNET')
          # Prevent the disabled built-in APK updater from asking to install packages.
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in xml:
              xml = xml.replace('</manifest>',
                  '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"'
                  ' tools:node="remove" />\n</manifest>')
          offline.write_text(xml, encoding='utf-8')

          g = gradle.read_text(encoding='utf-8')
          if ('tasks-builtin-sync.gradle.kts' not in g or
                  'generated/builtin-sync-assets' not in g or
                  'create("offline")' not in g):
              raise SystemExit('FAIL: upstream offline / clipboard build wiring changed')
          g, a = re.subn(r'(?m)^[ \t]*abiFilters\s*\+=\s*listOf\([^\n)]*\)[ \t]*\n', '', g)
          g, b = re.subn(r'(?m)^([ \t]*)include\("armeabi-v7a", "arm64-v8a", "x86", "x86_64"\)',
                         r'\1include("arm64-v8a")', g)
          g, c = re.subn(r'isUniversalApk\s*=\s*true', 'isUniversalApk = false', g)
          if b != 1 or c != 1 or a > 1:
              raise SystemExit(f'FAIL: upstream ABI rules changed: {a=}, {b=}, {c=}')
          if re.search(r'(?m)^[ \t]*abiFilters\s*\+=', g):
              raise SystemExit('FAIL: conflicting ABI filters still present')
          gradle.write_text(g, encoding='utf-8')
          print('PASS: upstream assembleOffline; no INTERNET; ARM64 only; clipboard retained')
          PY

      - name: 6.5. Guard Windows sync UI before NSD starts (v6)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("app/src/main/java/com/kingzcheung/xime")
          matches = []
          # Guard the Compose panel, not a hard-coded WindowsDevices.start()
          # signature; upstream may rename or change start() parameters.
          for path in (root / "ui").rglob("*.kt"):
              src = path.read_text(encoding="utf-8")
              if "WindowsDevices" not in src or "DisposableEffect" not in src:
                  continue
              # Find a Compose function with an ordinary block body.
              for m in re.finditer(r"\bfun\s+([A-Za-z_]\w*)\s*\(", src):
                  prefix = src[max(0, m.start() - 500):m.start()]
                  annotation = list(re.finditer(
                      r"@(?:androidx\.compose\.runtime\.)?Composable\b", prefix))
                  if not annotation:
                      continue
                  if re.search(r"\bfun\s+\w+\s*\(", prefix[annotation[-1].end():]):
                      continue
                  # Match parameter-list parentheses, including nested defaults.
                  depth, end = 0, -1
                  for i in range(m.end()-1, min(len(src), m.end()+2000)):
                      if src[i] == "(": depth += 1
                      if src[i] == ")":
                          depth -= 1
                          if depth == 0:
                              end = i
                              break
                  if end < 0:
                      continue
                  header = src[end+1:end+450]
                  body_match = re.match(r"\s*(?::\s*(?:Unit|kotlin\.Unit)\s*)?\{", header)
                  if not body_match:
                      continue
                  pos = end + 1 + body_match.end() - 1
                  lookahead = src[pos+1:pos+5000]
                  if "WindowsDevices" not in lookahead:
                      continue
                  # Favor the panel seen in the previous Android crash stack.
                  score = (10 if m.group(1) == "WindowsDevicesPanel" else 0)
                  score += (4 if "DisposableEffect" in lookahead else 0)
                  score += (3 if re.search(
                      r"WindowsDevices\.(?:start|enterSettings)\s*\(", lookahead) else 0)
                  if score >= 4:
                      matches.append((score, path, src, m.group(1), pos))
          if not matches:
              raise SystemExit(
                  "FAIL: Windows sync Compose panel changed. "
                  "Please provide the upstream WindowsDevicesPanel.kt source.")
          matches.sort(key=lambda x: x[0], reverse=True)
          if len(matches) > 1 and matches[0][0] == matches[1][0]:
              raise SystemExit("FAIL: ambiguous Windows sync panels: " +
                  ", ".join(str(m[1]) for m in matches[:4]))
          score, path, src, method, pos = matches[0]
          if "cyimeOfflineNsdGuard" in src:
              raise SystemExit("FAIL: duplicate offline NSD guard detected")
          # Return only from the Windows devices panel. Other clipboard views,
          # clipboard history and the sync source files stay untouched.
          guard = (
              "\n"
              "    // cyimeOfflineNsdGuard: do not initialize NSD without INTERNET.\n"
              "    if (androidx.compose.ui.platform.LocalContext.current.checkSelfPermission(\n"
              "            android.Manifest.permission.INTERNET) !=\n"
              "        android.content.pm.PackageManager.PERMISSION_GRANTED) {\n"
              "        androidx.compose.material3.Text(\n"
              "            \"离线版：Windows 同步不可用；本机剪贴板可以正常使用\"\n"
              "        )\n"
              "        return\n"
              "    }\n"
          )
          src = src[:pos+1] + guard + src[pos+1:]
          assert src.count("cyimeOfflineNsdGuard") == 1
          path.write_text(src, encoding="utf-8")
          print("PASS: Windows sync panel guarded:", path, method)
          print("PASS: local clipboard and Windows sync source retained")
          PY

      - name: 7. Download current official T9 model into Rime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          p = Path('app/src/main/java/com/kingzcheung/xime/model/CandidateModelCatalog.kt')
          s = p.read_text(encoding='utf-8')
          constants = dict(re.findall(r'\bconst val\s+(\w+)\s*=\s*"(https?[^\"]+)"', s))
          ids = dict(re.findall(r'\bconst val\s+(\w+)\s*=\s*"([^\"]+)"', s))
          found = []
          for block in s.split('ModelInfo(')[1:]:
              first = re.match(r'\s*(?:"([^\"]+)"|(\w+))', block)
              if not first:
                  continue
              model_id = first.group(1) or ids.get(first.group(2))
              if model_id == 't9-ngram':
                  found.append(block)
          if len(found) != 1:
              raise SystemExit(f'FAIL: expected one T9 catalog entry, found {len(found)}')
          block = found[0]
          versions = list(re.finditer(r'ModelVersion\(\s*version\s*=\s*"([^\"]+)"', block))
          if not versions:
              raise SystemExit('FAIL: T9 versions no longer have expected catalog format')
          # Kotlin catalogs list the newest public model first; do not select old v3 blindly.
          latest = block[versions[0].start():(versions[1].start() if len(versions)>1 else len(block))]
          pat = (r'ModelFile\(\s*"t9_ngram\.lm"\s*,\s*'
                 r'(?:("https?[^\"]+")|(\w+)\s*\+\s*"([^\"]+)")\s*,\s*'
                 r'"([a-fA-F0-9]{64})"\s*,\s*(\d+)L')
          hits = list(re.finditer(pat, latest))
          if len(hits) != 1:
              raise SystemExit('FAIL: newest T9 version has no unique t9_ngram.lm file')
          m = hits[0]
          url = m.group(1)[1:-1] if m.group(1) else constants.get(m.group(2), '') + m.group(3)
          if not url.startswith('https://') or not re.fullmatch(r'[0-9a-f]{64}', m.group(4).lower()):
              raise SystemExit('FAIL: T9 catalog URL or hash is missing')
          item = {'id':'t9-ngram', 'version':versions[0].group(1), 'name':'t9_ngram.lm',
                  'url':url, 'sha256':m.group(4).lower(), 'size':int(m.group(5))}
          if item['size'] < 20_000_000:
              raise SystemExit('FAIL: unexpected T9 size (possibly a lite or placeholder model)')
          meta = Path(os.environ['RUNNER_TEMP']) / 'cyime-current-t9.json'
          meta.write_text(json.dumps(item, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('CYIME_T9_URL='+url+'\n')
          print('Official T9:',item['version'],item['size'],'bytes')
          PY
          CYIME_T9_URL="$(python3 -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"cyime-current-t9.json").read_text())["url"])')"
          MODEL="app/src/main/assets/rime_chinese/t9_ngram.lm"
          mkdir -p "$(dirname "$MODEL")"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            "$CYIME_T9_URL" -o "$MODEL"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          item=json.loads((Path(os.environ['RUNNER_TEMP'])/'cyime-current-t9.json').read_text())
          p=Path('app/src/main/assets/rime_chinese/t9_ngram.lm')
          assert p.stat().st_size==item['size'], 'FAIL: downloaded T9 size mismatch'
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()==item['sha256'], 'FAIL: T9 SHA-256 mismatch'
          print('PASS: new T9 asset downloaded and verified:',item['version'])
          PY

      - name: 8. Extend and verify model bundling for both editions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, json, os, re
          root = Path('app/src/main/java/com/kingzcheung/xime')
          installer = root / 'model/BundledModelInstaller.kt'
          kotlin = installer.read_text(encoding='utf-8')
          extra = 'SpeechModelCatalog.XASR, "handwriting-formula", "candidate-gloss"'
          if not all(t in kotlin for t in ('SpeechModelCatalog.XASR', '"handwriting-formula"', '"candidate-gloss"')):
              # Find the bundled-model allowlist; never disable validation in the installer.
              options = list(re.finditer(r'\b(?:setOf|listOf)\s*\(([^()]*)\)', kotlin, re.S))
              options = [m for m in options if all(t in m.group(1) for t in (
                  'SpeechModelCatalog.PARAFORMER','SpeechModelCatalog.SENSEVOICE',
                  'BuiltinModelCatalog.SPEAKER_MODEL'))]
              if len(options) != 1:
                  raise SystemExit('FAIL: BundledModelInstaller allowlist changed; review model restoring logic')
              m=options[0]
              kotlin = kotlin[:m.end()-1]+', '+extra+kotlin[m.end()-1:]
              installer.write_text(kotlin, encoding='utf-8')
          print('PASS: on-device bundled model allowlist supports the three extensions')

          p=Path('scripts/prepare-bundled-models.py')
          s=p.read_text(encoding='utf-8')
          required = {
              'ochwpro','predictive-text-base','predictive-text-small',
              'sensevoice-multilingual-int8','speaker-campplus-zh',
              'paraformer-zh-en-int8','xasr-zh-en-punct-int8',
              'handwriting-formula','candidate-gloss'
          }
          matches=list(re.finditer(r'(?s)\bINCLUDED\s*=\s*\{[^}]*\}', s))
          if len(matches)!=1:
              raise SystemExit('FAIL: bundled models INCLUDED catalog changed')
          m=matches[0]
          s=s[:m.start()]+'INCLUDED = '+repr(required)+s[m.end():]
          old="('model/BuiltinModelCatalog.kt', 'speech/SpeechModelCatalog.kt')"
          new="('model/BuiltinModelCatalog.kt', 'speech/SpeechModelCatalog.kt', 'model/CandidateModelCatalog.kt')"
          if s.count(old)!=1:
              raise SystemExit('FAIL: bundled Kotlin catalog source list changed')
          s=s.replace(old,new,1)
          anchor="        for block in source.split('ModelInfo(')[1:]:"
          if s.count(anchor)!=1:
              raise SystemExit('FAIL: bundled Kotlin model parser changed')
          # Resolve Kotlin RELEASE + "file" URLs from each catalog instead of pinning old links.
          expansion=(
              "        base_urls = dict(re.findall(r'\\bconst val\\s+(\\w+)\\s*=\\s*\"(https?[^\"]+)\"', source))\n"
              "        source = re.sub(r'\\b([A-Za-z_]\\w*)\\s*\\+\\s*\"([^\"]+)\"',\n"
              "                        lambda m: '\"' + base_urls[m.group(1)] + m.group(2) + '\"'\n"
              "                        if m.group(1) in base_urls else m.group(0), source)\n"
          )
          s=s.replace(anchor,expansion+anchor,1)
          narrow=r'ModelFile\("([^"]+)", "([^"]*)", "([^"]*)", (\d+)L[,)]'
          wide=r'ModelFile\(\s*"([^"]+)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*,\s*(\d+)L\s*[,)]'
          if s.count(narrow)!=1:
              raise SystemExit('FAIL: model file parser changed; prevent incomplete packaging')
          s=s.replace(narrow,wide,1)
          p.write_text(s,encoding='utf-8')

          spec=importlib.util.spec_from_file_location('cyime_bundle',p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          models=mod.catalog()
          actual={m['id'] for m in models}
          if actual!=required or len(models)!=len(required):
              raise SystemExit(f'FAIL: expected 9 ordinary models; missing={required-actual}, extra={actual-required}')
          for model in models:
              if not model['version'] or not model['files']:
                  raise SystemExit('FAIL: empty version/files for '+model['id'])
              names=[x['name'] for x in model['files']]
              if len(names)!=len(set(names)):
                  raise SystemExit('FAIL: duplicate file names for '+model['id'])
              if model['archive']:
                  url,sha=model['archive']
                  if not url.startswith('https://') or not re.fullmatch('[0-9a-fA-F]{64}',sha):
                      raise SystemExit('FAIL: invalid archive metadata '+model['id'])
              else:
                  for f in model['files']:
                      if (not f['url'].startswith('https://') or
                          not re.fullmatch('[0-9a-fA-F]{64}',f['sha256']) or f['size']<=0):
                          raise SystemExit('FAIL: missing URL/checksum '+model['id']+'/'+f['name'])
          by_id={m['id']:m for m in models}
          if len(by_id['xasr-zh-en-punct-int8']['files'])!=4:
              raise SystemExit('FAIL: X-ASR archive structure changed')
          if len(by_id['handwriting-formula']['files'])!=4:
              raise SystemExit('FAIL: formula handwriting structure changed')
          if not any(f['name'].startswith('cyime_gloss-') for f in by_id['candidate-gloss']['files']):
              raise SystemExit('FAIL: candidate-gloss model files changed')
          out=Path(os.environ['RUNNER_TEMP'])/'cyime-ordinary-models.json'
          out.write_text(json.dumps({m['id']:{'version':m['version'],
              'files':[f['name'] for f in m['files']]} for m in models}, indent=2),encoding='utf-8')
          for m in sorted(models, key=lambda m:m['id']):
              print('CATALOG:',m['id'],m['version'],len(m['files']),'files')
          print('PASS: nine selected model catalogs parsed from this upstream tag')
          PY

      - name: 9. Build selected full OFFLINE APK
        id: build
        shell: bash
        env:
          EDITION: ${{ inputs.edition }}
          MIN_CODE: ${{ inputs.minimum_version_code }}
        run: |
          set -euo pipefail
          BASE_CODE=$(grep -oP '^\s*versionCode = \K[0-9]+' app/build.gradle.kts | head -n 1)
          BASE_NAME=$(grep -oP '^\s*versionName = "\K[^"]+' app/build.gradle.kts | head -n 1)
          [ -n "$BASE_CODE" ] && [ -n "$BASE_NAME" ] || exit 1
          VERSION_CODE=$((BASE_CODE + 500000 + GITHUB_RUN_NUMBER))
          if [ -n "$MIN_CODE" ]; then
            [[ "$MIN_CODE" =~ ^[0-9]+$ ]] || { echo "Invalid minimum_version_code"; exit 1; }
            if (( MIN_CODE > VERSION_CODE )); then VERSION_CODE="$MIN_CODE"; fi
          fi
          if [ "$EDITION" = "official-full" ]; then
            IDS="ochwpro,predictive-text-base,predictive-text-small,sensevoice-multilingual-int8,speaker-campplus-zh"
          elif [ "$EDITION" = "expanded-10" ]; then
            IDS="ochwpro,predictive-text-base,predictive-text-small,sensevoice-multilingual-int8,speaker-campplus-zh,paraformer-zh-en-int8,handwriting-formula,candidate-gloss,xasr-zh-en-punct-int8"
          else
            echo "Unsupported edition: $EDITION"; exit 1
          fi
          VERSION_NAME="${BASE_NAME}-offline"
          echo "base_name=$BASE_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Edition=$EDITION, models=$IDS, versionCode=$VERSION_CODE"
          rm -f app/keystore.properties
          ./gradlew :app:assembleOffline \
            -PbundleModels=true \
            -PbundledModelIds="$IDS" \
            -PpythonExecutable=python3 \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            --no-daemon

      - name: 10. Sign with existing CYIME secrets
        id: signed
        shell: bash
        env:
          KEY_B64: ${{ secrets.CYIME_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CYIME_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CYIME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CYIME_KEY_PASSWORD }}
          EDITION: ${{ inputs.edition }}
          BASE_NAME: ${{ steps.build.outputs.base_name }}
        run: |
          set -euo pipefail
          for x in KEY_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!x:-}" ] || { echo "Missing signing secret: $x"; exit 1; }
          done
          APK_IN=$(find app/build/outputs/apk/offline -maxdepth 1 \
            -type f -name '*-full-arm64-v8a.apk' -print -quit)
          [ -n "$APK_IN" ] || { echo "Full ARM64 APK missing"; exit 1; }
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)
          [ -x "$BT/apksigner" ] || exit 1
          KEYSTORE="$RUNNER_TEMP/cyime-signing.p12"
          ALIGNED="$RUNNER_TEMP/cyime-aligned.apk"
          APK_OUT="$RUNNER_TEMP/CyIME-${BASE_NAME}-${EDITION}-offline-arm64-v8a.apk"
          trap 'rm -f "$KEYSTORE" "$ALIGNED"' EXIT
          printf '%s' "$KEY_B64" | base64 --decode > "$KEYSTORE"
          "$BT/zipalign" -f -P 16 4 "$APK_IN" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out "$APK_OUT" "$ALIGNED"
          "$BT/apksigner" verify --min-sdk-version 23 --verbose --print-certs "$APK_OUT"
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"
          echo "bt=$BT" >> "$GITHUB_OUTPUT"

      - name: 11. Verify permissions, model versions, T9, ARM64 and signature
        shell: bash
        env:
          APK: ${{ steps.signed.outputs.apk }}
          BT: ${{ steps.signed.outputs.bt }}
          EDITION: ${{ inputs.edition }}
          EXPECTED_VERSION_CODE: ${{ steps.build.outputs.version_code }}
        run: |
          set -euo pipefail
          "$BT/aapt" dump permissions "$APK" | tee permissions.txt
          for P in INTERNET REQUEST_INSTALL_PACKAGES; do
            if grep -Fq "android.permission.$P'" permissions.txt; then
              echo "FAIL: forbidden permission: $P"; exit 1
            fi
          done
          for P in ACCESS_NETWORK_STATE ACCESS_WIFI_STATE; do
            if ! grep -Fq "android.permission.$P'" permissions.txt; then
              echo "FAIL: required network status read permission missing: $P"; exit 1
            fi
          done
          "$BT/aapt" dump badging "$APK" > badging.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,zipfile
          badging=Path('badging.txt').read_text(encoding='utf-8')
          assert "package: name='com.cyletix.cyime'" in badging,'Wrong application ID'
          v=re.search(r"versionCode='(\d+)'",badging)
          assert v and int(v[1])==int(os.environ['EXPECTED_VERSION_CODE']),'Wrong versionCode'
          apk_file=os.environ['APK']
          edition=os.environ['EDITION']
          chosen=json.loads((Path(os.environ['RUNNER_TEMP'])/'cyime-ordinary-models.json').read_text())
          t9=json.loads((Path(os.environ['RUNNER_TEMP'])/'cyime-current-t9.json').read_text())
          basic={'ochwpro','predictive-text-base','predictive-text-small',
                 'sensevoice-multilingual-int8','speaker-campplus-zh'}
          expanded={'paraformer-zh-en-int8','xasr-zh-en-punct-int8',
                    'handwriting-formula','candidate-gloss'}
          expected=basic|(expanded if edition=='expanded-10' else set())
          assert expected<=set(chosen),'Preflight catalog is incomplete'
          def sha_zip(z,path):
              h=hashlib.sha256()
              with z.open(path) as f:
                  for b in iter(lambda:f.read(4*1024*1024),b''): h.update(b)
              return h.hexdigest()
          with zipfile.ZipFile(apk_file) as z:
              files=set(z.namelist())
              assert any(s.startswith('lib/arm64-v8a/') for s in files),'Missing arm64 native libs'
              assert not any(s.startswith(('lib/armeabi-v7a/','lib/x86/','lib/x86_64/')) for s in files),'Unexpected other architecture'
              path='assets/bundled-models/manifest.json'
              assert path in files,'Full-model manifest missing'
              manifest=json.loads(z.read(path))
              ids=[m['id'] for m in manifest]
              assert len(ids)==len(expected) and set(ids)==expected,f'Missing/extra model IDs: {ids}'
              for m in manifest:
                  current=chosen[m['id']]
                  assert m['version']==current['version'],f'Outdated version for {m["id"]}'
                  assert sorted(f['name'] for f in m['files'])==sorted(current['files']),'Model file list differs for '+m['id']
                  for item in m['files']:
                      p=f'assets/bundled-models/{m["id"]}/{item["name"]}'
                      assert p in files,'Missing '+p
                      assert z.getinfo(p).file_size==int(item['size']),'Wrong file size '+p
                      assert sha_zip(z,p)==item['sha256'],'Wrong file hash '+p
              tpath='assets/rime_chinese/t9_ngram.lm'
              tmanifest='assets/rime-bundled-manifest.tsv'
              assert tpath in files and tmanifest in files,'Missing T9/Rime manifest'
              assert z.getinfo(tpath).file_size==t9['size'],'Wrong current T9 size'
              assert sha_zip(z,tpath)==t9['sha256'],'Wrong current T9 checksum'
              rows=[line.split('\t') for line in z.read(tmanifest).decode('utf-8').splitlines()]
              assert [t9['sha256'],str(t9['size']),'rime_chinese/t9_ngram.lm','t9_ngram.lm'] in rows, 'T9 not indexed by Rime installer'
              assert z.testzip() is None,'APK archive CRC error'
          size=Path(apk_file).stat().st_size/1_000_000
          assert size>(450 if edition=='expanded-10' else 350), f'Suspiciously small full APK: {size:.1f} MB'
          print(f'PASS: offline {edition}, {len(expected)} current ordinary models + T9 {t9["version"]} ({size:.1f} MB)')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write(f'## CyIME offline APK OK\n\n- Edition: {edition}\n- APK: {size:.1f} MB\n- T9: {t9["version"]}\n')
              for m in manifest:
                  f.write(f'- {m["id"]}: {m["version"]}\n')
          PY
          "$BT/apksigner" verify --min-sdk-version 28 --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: 12. Upload verified APK directly
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.signed.outputs.apk }}
          archive: false
          if-no-files-found: error
          retention-days: 30
